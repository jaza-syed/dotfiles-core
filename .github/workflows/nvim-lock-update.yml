name: nvim lock update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # The nvim config requires the gitignored generated theme modules.
      - name: Generate theme artifacts
        run: nix shell nixpkgs#luajit --command ./scripts/generate_colorscheme.sh
      - name: Update lazy-lock.json
        run: |
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE/nvim/.config/nvim" "$XDG_CONFIG_HOME/nvim"
          nix run nixpkgs#neovim -- --headless "+Lazy! update" "+qa"
      - uses: peter-evans/create-pull-request@v7
        with:
          add-paths: nvim/.config/nvim/lazy-lock.json
          branch: nvim-lock-update
          commit-message: "nvim: update lazy-lock.json"
          title: "nvim: update lazy-lock.json"
          body: "Weekly plugin lock refresh from `Lazy! update`."
