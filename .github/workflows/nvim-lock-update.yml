name: nvim lock update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # The nvim config requires the gitignored generated theme modules.
      - name: Generate theme artifacts
        run: nix shell nixpkgs#luajit --command ./scripts/generate_colorscheme.sh
      - name: Update nvim-pack-lock.json
        run: |
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE/nvim/.config/nvim" "$XDG_CONFIG_HOME/nvim"
          nix run nixpkgs#neovim -- --headless \
            -c "lua vim.pack.update(nil, { force = true })" -c "qa"
      - uses: peter-evans/create-pull-request@v8
        with:
          add-paths: nvim/.config/nvim/nvim-pack-lock.json
          branch: nvim-lock-update
          commit-message: "nvim: update nvim-pack-lock.json"
          title: "nvim: update nvim-pack-lock.json"
          body: "Weekly plugin lock refresh from `vim.pack.update()`."
