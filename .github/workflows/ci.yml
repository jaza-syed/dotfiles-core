name: CI

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix eval --raw .#darwinConfigurations.base-jsyed.system.drvPath
      - run: nix eval --raw .#homeConfigurations.base-jsyed.activationPackage.drvPath

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: shellcheck
        run: nix run nixpkgs#shellcheck -- --severity=warning scripts/*.sh shell/.config/shell/*.sh
      - name: stylua
        run: |
          nix run nixpkgs#ripgrep -- --files --hidden -0 nvim tests -g '*.lua' \
            | xargs -0 nix run nixpkgs#stylua -- --config-path .stylua.toml --check

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # tests/nvim_quickfix.lua wraps mini.bracketed, at the revision the config pins.
      - name: mini.bracketed
        run: |
          lock=nvim/.config/nvim/nvim-pack-lock.json
          git init -q "$RUNNER_TEMP/mini.bracketed"
          git -C "$RUNNER_TEMP/mini.bracketed" fetch -q --depth 1 \
            "$(nix run nixpkgs#jq -- -r '.plugins["mini.bracketed"].src' "$lock")" \
            "$(nix run nixpkgs#jq -- -r '.plugins["mini.bracketed"].rev' "$lock")"
          git -C "$RUNNER_TEMP/mini.bracketed" checkout -q FETCH_HEAD
      - name: nvim unit tests
        env:
          MINI_BRACKETED_ROOT: ${{ runner.temp }}/mini.bracketed
        run: |
          for test in tests/*.lua; do
            echo "== $test"
            nix run nixpkgs#neovim -- --headless -u NONE -i NONE -l "$test"
          done
      - name: setup checks
        run: nix shell nixpkgs#ripgrep --command ./tests/setup.sh
