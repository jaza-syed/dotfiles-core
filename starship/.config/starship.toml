format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$custom$git_commit$git_state$git_metrics$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$os$shell$character"
add_newline = false

[hostname]
ssh_only = false

[git_branch]
disabled = true

[custom.linear_branch]
command = '''
branch="$(git branch --show-current 2>/dev/null)" || exit 1
printf '%s\n' "$branch" | sed -E \
  -e 's@^(feature|bugfix|refactor|hotfix)/([[:alpha:]]+-[[:digit:]]+)-.*$@\1/\2…@' \
  -e 's@^(feature|bugfix|refactor|hotfix)/.*-([[:alpha:]]+-[[:digit:]]+)$@\1/\2…@'
'''
format = '[$symbol$output]($style) '
shell = ["sh"]
style = 'bold purple'
symbol = ' '
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'

[nix_shell]
format = 'via [$symbol $state\($name\)]($style) '
symbol = ''
