# Set that stupid Esc-Wait off, so VI works again
set -sg escape-time 0

# Pin the pane shell. Otherwise tmux inherits $SHELL from whatever started the
# server, and a nix devshell there gives every pane a bash that never reads
# ~/.bashrc.
set -g default-shell /bin/zsh

# change the prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Use mouse
set -g mouse on
# Open OSC 8 hyperlinks under the mouse; preserve normal mouse behavior elsewhere.
bind-key -n MouseDown1Pane if-shell -F '#{mouse_hyperlink}' 'select-pane -t = ; run-shell -b "open -- #{q:mouse_hyperlink}"' 'select-pane -t = ; send-keys -M'

# Scroll speed
bind -Tcopy-mode-vi WheelUpPane send -N1 -X scroll-up
bind -Tcopy-mode-vi WheelDownPane send -N1 -X scroll-down

# Extended keys for pi
set -g extended-keys on
set -g extended-keys-format csi-u

# more intuitive split keys
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# Use prefix-r to respawn the current pane in its current directory
bind-key r confirm-before -p 'Respawn pane in #{pane_current_path}?' 'respawn-pane -k -c "#{pane_current_path}"'

# Use prefix-R to reload tmux configuration
bind-key R run-shell 'tmux source ~/.config/tmux/tmux.conf && tmux display-message "tmux.conf reloaded!"'

# Use prefix-[hjkl] to move between panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Sticky resize mode. Re-enter the table before resizing so hitting a pane-size
# limit does not unexpectedly leave the mode.
set -g @resize-hint 'RESIZE  hjkl 1 cell · HJKL 5 cells · Esc exit'
unbind-key S
bind-key S switch-client -T resize

bind-key -T resize h switch-client -T resize \; resize-pane -L 1
bind-key -T resize j switch-client -T resize \; resize-pane -D 1
bind-key -T resize k switch-client -T resize \; resize-pane -U 1
bind-key -T resize l switch-client -T resize \; resize-pane -R 1

bind-key -T resize H switch-client -T resize \; resize-pane -L 5
bind-key -T resize J switch-client -T resize \; resize-pane -D 5
bind-key -T resize K switch-client -T resize \; resize-pane -U 5
bind-key -T resize L switch-client -T resize \; resize-pane -R 5

bind-key -T resize Escape switch-client -T root
bind-key -T resize q      switch-client -T root

# copy paste - use vi keys
setw -g mode-keys vi
# in copy mode 'v' to start selection, 'y' to copy selection to system clipboard
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection 

# misc
set -g bell-action none 

# TERM - better colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ',*:usstyle'
set -as terminal-features ',*:hyperlinks'

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Heavy pane borders are visually distinct from app-drawn terminal borders.
set -g pane-border-lines heavy
set -g pane-border-status off
# Half-coloured border plus an arrow beside the active pane. tmux omits the
# arrow when the right or lower pane is active.
set -g pane-border-indicators both

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Allow escape sequences (e.g. wezterm user-var) to pass through to the outer terminal
set -g allow-passthrough on

# Paired with ~/.ssh/rc script https://werat.dev/blog/happy-ssh-agent-forwarding/
set-environment -g "SSH_AUTH_SOCK" ~/.ssh/ssh_auth_sock

# Import the shell-resolved theme into new sessions as a startup hint.
# Use a fixed array slot so reloading this file does not duplicate the entry.
set -g update-environment[99] DOTFILES_THEME

# Colors: loaded from generated palette (see palettes/ and scripts/generate_colorscheme.sh)
set -g @theme 'light'
source-file ~/.config/tmux/statusline.conf
source-file ~/.config/tmux/colors-light.conf

# Disable C-[hjkl] navigation when in terminal apps that use them for list navigation
is_tui="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|atuin)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_tui" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-l' if-shell "$is_tui" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-j' if-shell "$is_tui" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_tui" 'send-keys C-k' 'select-pane -U'

# theme
# source ~/.tmux/themes/tomorrow-night.tmux

# Re-apply the session theme when tmux creates or refreshes session UI.
# This keeps tmux's session environment aligned with session @theme.
set-hook -g session-created 'run-shell "~/.config/tmux/apply-theme.sh \"\" \"#{session_name}\""'
set-hook -g client-attached 'run-shell "~/.config/tmux/apply-theme.sh \"\" \"#{session_name}\""'
set-hook -g after-new-window 'run-shell "~/.config/tmux/apply-theme.sh \"\" \"#{session_name}\""'
set-hook -g after-split-window 'run-shell "~/.config/tmux/apply-theme.sh \"\" \"#{session_name}\""'

# Prompt for a manual pane label shown in the bottom pane border.
unbind-key t
bind-key t command-prompt -p 'pane label:' -I '#{@pane_label}' 'set-option -p @pane_label "%1" ; select-pane -T "%1"'

# Theme apply: Prefix T r
unbind-key T
bind-key T switch-client -T theme
bind-key -T theme r run-shell '~/.config/tmux/apply-theme.sh "" "#{session_name}"'

# Sticky move mode. Each binding re-enters the table so keys can be repeated.
# tmux can only reorder panes within a level; nesting and popping out are the
# operations it otherwise has no way to express.
set -g @move-hint 'MOVE  hjkl reorder · HJKL change level · 0-9 window · Esc exit'
unbind-key m
bind-key m switch-client -T move

# Both operations rewrite the layout tree in move-pane.py, which is the only way
# to express a move between levels. A move with nowhere to go is a no-op, so no
# edge guards are needed here.
bind-key -T move h run-shell '~/.config/tmux/move-pane.py swap left'  \; switch-client -T move
bind-key -T move j run-shell '~/.config/tmux/move-pane.py swap down'  \; switch-client -T move
bind-key -T move k run-shell '~/.config/tmux/move-pane.py swap up'    \; switch-client -T move
bind-key -T move l run-shell '~/.config/tmux/move-pane.py swap right' \; switch-client -T move

# Change level: enter the neighbour in that direction, or leave the container
# when there is no neighbour to enter. Position in the tree decides which.
bind-key -T move H run-shell '~/.config/tmux/move-pane.py level left'  \; switch-client -T move
bind-key -T move J run-shell '~/.config/tmux/move-pane.py level down'  \; switch-client -T move
bind-key -T move K run-shell '~/.config/tmux/move-pane.py level up'    \; switch-client -T move
bind-key -T move L run-shell '~/.config/tmux/move-pane.py level right' \; switch-client -T move

# Send the pane to another window and follow it. switch-client comes first here
# because tmux abandons the rest of a sequence when a command fails, and a
# missing target window should not also drop out of move mode.
bind-key -T move 0 switch-client -T move \; join-pane -t :=0 \; select-window -t :=0
bind-key -T move 1 switch-client -T move \; join-pane -t :=1 \; select-window -t :=1
bind-key -T move 2 switch-client -T move \; join-pane -t :=2 \; select-window -t :=2
bind-key -T move 3 switch-client -T move \; join-pane -t :=3 \; select-window -t :=3
bind-key -T move 4 switch-client -T move \; join-pane -t :=4 \; select-window -t :=4
bind-key -T move 5 switch-client -T move \; join-pane -t :=5 \; select-window -t :=5
bind-key -T move 6 switch-client -T move \; join-pane -t :=6 \; select-window -t :=6
bind-key -T move 7 switch-client -T move \; join-pane -t :=7 \; select-window -t :=7
bind-key -T move 8 switch-client -T move \; join-pane -t :=8 \; select-window -t :=8
bind-key -T move 9 switch-client -T move \; join-pane -t :=9 \; select-window -t :=9

bind-key -T move Escape switch-client -T root
bind-key -T move q      switch-client -T root

# Plugins. tmux-fzf complements direct and modal bindings with fuzzy discovery
# of live commands, key bindings, sessions, windows, and panes.
TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_ORDER="command|keybinding|session|window|pane"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'

# Keep TPM initialization at the bottom of this file.
run '~/.local/share/tmux/plugins/tpm/tpm'
