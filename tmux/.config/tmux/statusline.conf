# Custom repo-owned statusline. Colors come from generated colors-*.conf files.

set -g status-interval 5
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 120

set -g @statusline-left-sep ''
set -g @statusline-right-sep ''
set -g @statusline-window-left-sep ''
set -g @statusline-window-right-sep ''
set -g @statusline-window-zoom-icon ''

set -g @statusline-session-icon ''
set -g @statusline-cpu-icon ''
set -g @statusline-ram-icon ''
# macOS only: 'activity' approximates Activity Monitor Memory Used;
# 'pressure' uses the inverse of memory_pressure's free/headroom percentage.
set -g @statusline-ram-metric 'pressure'
set -g @statusline-time-icon ''
set -g @statusline-network-wifi-icon ''
set -g @statusline-network-ethernet-icon '󰈀'
set -g @statusline-network-offline-icon '󰌙'
set -g @statusline-battery-charging-icon ''
set -g @statusline-battery-missing-icon '󱉝'
set -g @statusline-battery-percentage-0 ''
set -g @statusline-battery-percentage-1 ''
set -g @statusline-battery-percentage-2 ''
set -g @statusline-battery-percentage-3 ''
set -g @statusline-battery-percentage-4 ''
set -g @statusline-time-format '%a %I:%M %p'
